[package]
name = "eska-project"
version.workspace = true
edition = "2024"
publish = true
description = "Standalone Designer XML project operations and metadata presentation"
license = "Apache-2.0"
repository = "https://github.com/1c-tooling/eska"
readme = "../../README.md"
keywords = ["1c-enterprise", "cli", "designer-xml"]
categories = ["command-line-utilities", "development-tools"]
authors = ["Aleksey Kalsin <aleksey@kalsin.pro>"]

[lints]
workspace = true

[dependencies]
eska-tool-runtime = { workspace = true }
eska-terminal = { workspace = true }
eska-project-core = { workspace = true }
eska-presentation = { workspace = true }
eska-analyzer = { workspace = true }
ctrlc = { version = "3.5.2", features = ["termination"] }
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
clap = { version = "4.6.7", features = ["derive", "string"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
