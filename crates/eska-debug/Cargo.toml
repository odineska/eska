[package]
name = "eska-debug"
version.workspace = true
edition = "2024"
publish = true
license = "Apache-2.0"
description = "Native DAP and HTTP debugging for 1C Designer XML projects"
repository = "https://github.com/1c-tooling/eska"
readme = "../../README.md"
keywords = ["1c-enterprise", "debugger", "dap", "bsl"]
categories = ["development-tools::debugging", "command-line-utilities"]
authors = ["Aleksey Kalsin <aleksey@kalsin.pro>"]

[lints]
workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive", "string"] }
eska-build-runtime = { workspace = true }
eska-presentation = { workspace = true }
eska-project-core = { workspace = true }
eska-tool-runtime = { workspace = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
url = "2.5.8"
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
getrandom = "0.4.3"
httparse = "1.10.1"
roxmltree = { version = "0.21.2", default-features = false, features = ["std", "positions"] }
