[package]
name = "eska-project-core"
version.workspace = true
edition = "2024"
publish = true
description = "Shared Designer XML project model and checked metadata operations"
license = "Apache-2.0"
repository = "https://github.com/1c-tooling/eska"
readme = "../../README.md"
keywords = ["1c-enterprise", "designer-xml", "metadata"]
categories = ["development-tools", "filesystem"]
authors = ["Aleksey Kalsin <aleksey@kalsin.pro>"]

[lints]
workspace = true

[dependencies]
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
bstr = { version = "1.13.1", default-features = false, features = ["std"] }
directories = "6.0.0"
gix-path = "0.14.1"
gix-validate = "0.13.1"
quick-xml = { version = "0.42.0", default-features = false }
roxmltree = { version = "0.21.2", default-features = false, features = ["std", "positions"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
sha2 = "0.11.1"
toml = { version = "1.1.8", default-features = false, features = ["display", "parse", "serde"] }
unicode-general-category = "1.1.0"
zip = { version = "9.1.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
toml_edit = { version = "0.25.17", default-features = false, features = ["display", "parse"] }
