[package]
name = "eska-build-runtime"
version.workspace = true
edition = "2024"
publish = true
description = "Shared 1C platform runner and reversible native artifact execution"
license = "Apache-2.0"
repository = "https://github.com/1c-tooling/eska"
readme = "../../README.md"
keywords = ["1c-enterprise", "designer-xml", "build"]
categories = ["development-tools", "filesystem"]
authors = ["Aleksey Kalsin <aleksey@kalsin.pro>"]

[lints]
workspace = true

[dependencies]
eska-project-core = { workspace = true }
gix-path = "0.14.1"
roxmltree = { version = "0.21.2", default-features = false, features = ["std", "positions"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
toml = { version = "1.1.8", default-features = false, features = ["display", "parse", "serde"] }

[target.'cfg(unix)'.dependencies]
eska-tool-runtime = { workspace = true }
signal-hook = { version = "0.4.5", default-features = false }

[target.'cfg(windows)'.dependencies]
ctrlc = { version = "3.5.2", features = ["termination"] }
