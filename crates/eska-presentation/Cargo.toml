[package]
name = "eska-presentation"
version.workspace = true
edition = "2024"
publish = true
description = "Shared localization and path presentation for ESKA tools"
license = "Apache-2.0"
repository = "https://github.com/1c-tooling/eska"
readme = "../../README.md"
keywords = ["1c-enterprise", "cli", "localization"]
categories = ["command-line-interface", "localization"]
authors = ["Aleksey Kalsin <aleksey@kalsin.pro>"]

[lints]
workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive", "string"] }
eska-tool-runtime = { workspace = true }
eska-project-core = { workspace = true }
fluent = "0.17.0"
serde_json = "1.0.154"
sys-locale = "0.3.2"
