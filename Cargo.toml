[package]
name = "eska"
default-run = "eska"
version.workspace = true
edition = "2024"
publish = true
description = "Утилита для разработчиков 1С Enterprise"
license = "Apache-2.0"
repository = "https://github.com/1c-tooling/eska"
readme = "README.md"
keywords = ["1c-enterpirse", "cli"]
categories = ["command-line-utilities", "filesystem"]
authors = ["Aleksey Kalsin <aleksey@kalsin.pro>"]

[workspace]
members = [".", "crates/*"]
default-members = [".", "crates/*"]
exclude = ["tests/fixtures/ibcmd"]
resolver = "3"

[workspace.package]
version = "0.22.1"

[workspace.dependencies]
eska-analyzer = { path = "crates/eska-analyzer", version = "=0.22.1" }
eska-build = { path = "crates/eska-build", version = "=0.22.1" }
eska-build-runtime = { path = "crates/eska-build-runtime", version = "=0.22.1" }
eska-check = { path = "crates/eska-check", version = "=0.22.1" }
eska-fmt = { path = "crates/eska-fmt", version = "=0.22.1" }
eska-presentation = { path = "crates/eska-presentation", version = "=0.22.1" }
eska-project = { path = "crates/eska-project", version = "=0.22.1" }
eska-project-core = { path = "crates/eska-project-core", version = "=0.22.1" }
eska-terminal = { path = "crates/eska-terminal", version = "=0.22.1" }
eska-tool-runtime = { path = "crates/eska-tool-runtime", version = "=0.22.1" }
eska-vcs = { path = "crates/eska-vcs", version = "=0.22.1" }

[profile.dev]
opt-level = 0 # No optimization for fast compile times
debug = true  # Include debug symbols

[profile.release]
opt-level = 3 # Maximum optimization for performance
debug = false # Exclude debug symbols for smaller binary size
lto = true    # Link-Time Optimization for further size reduction

[profile.dist]
inherits = "release"
lto = "thin"

[lints]
workspace = true

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Curl/Rustls and existing cross-platform crates pin incompatible windows-sys lines.
multiple_crate_versions = { level = "allow", priority = 1 }

[dependencies]
eska-tool-runtime = { workspace = true }
eska-presentation = { workspace = true }
axoupdater = { version = "0.10.3", default-features = false, features = ["github_releases"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
semver = "1.0.28"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "time", "net"] }
clap = { version = "4.6.7", features = ["derive", "string"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
# Workspace integration helpers must not become registry publication prerequisites.
eska-vcs = { path = "crates/eska-vcs" }
eska-project-core = { path = "crates/eska-project-core" }
eska-project = { path = "crates/eska-project" }
gix = { version = "0.90.0", default-features = false, features = ["max-performance", "revision", "sha1", "status", "worktree-mutation"] }
roxmltree = { version = "0.21.2", default-features = false, features = ["std", "positions"] }
toml = { version = "1.1.8", default-features = false, features = ["display", "parse", "serde"] }
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
zip = { version = "9.1.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.31.3", default-features = false, features = ["signal", "process"] }

[target.'cfg(windows)'.dependencies]
self-replace = "1.5.0"

[target.'cfg(windows)'.dev-dependencies]
# curl's ssl feature uses Schannel and the Windows certificate store on this target.
gix = { version = "0.90.0", default-features = false, features = ["blocking-http-transport-curl-openssl"] }

[target.'cfg(not(windows))'.dev-dependencies]
gix = { version = "0.90.0", default-features = false, features = ["blocking-http-transport-curl-rustls"] }
