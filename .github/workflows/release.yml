name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза vX.Y.Z; dry-run только собирает и проверяет файлы'
        required: true
        default: dry-run

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-22.04, target: x86_64-unknown-linux-musl }
          - { runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-musl }
          - { runner: macos-15, target: aarch64-apple-darwin }
          - { runner: macos-15-intel, target: x86_64-apple-darwin }
          - { runner: windows-2022, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Установка Rust из rust-toolchain.toml
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup show
          rustup target add "$TARGET"
      - name: Системные зависимости Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools pkg-config libssl-dev
      - name: Установка cargo-dist
        if: runner.os != 'Windows'
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh
      - name: Установка cargo-dist для Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: irm https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.ps1 | iex
      - name: Подготовка полного графа зависимостей для лицензий
        run: |
          cargo fetch --locked
          cargo metadata --format-version 1 --locked --offline > /dev/null
      - name: Сборка и упаковка всех компонентов
        env:
          TARGET: ${{ matrix.target }}
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
          # x86_64 static PIE needs Rust's default linker, not the musl-gcc wrapper.
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: |
          cargo build --workspace --bins --locked --profile dist --target "$TARGET"
          python -B tools/package_components.py --bin-dir "target/$TARGET/dist" --output target/components \
            --component eska --component eska-project --component eska-check --component eska-build --component eska-vcs --component eska-fmt --component eska-debug
          python -B tools/release_bundle.py prepare --bin-dir "target/$TARGET/dist" --components target/components
          mkdir -p target/distrib
          dist build --artifacts=local --target "$TARGET" --no-local-paths --output-format=json > target/local-dist-manifest.json
          cp target/local-dist-manifest.json "target/distrib/$TARGET-dist-manifest.json"
      - name: Чистая и повторная установка, запуск Metadata API
        run: |
          mkdir -p ../eska-playground
          export ESKA_TEST_ROOT="$(python -c 'from pathlib import Path; print(Path("../eska-playground").resolve())')"
          python -B tests/release_smoke.py target/components
      - uses: actions/upload-artifact@v7
        with:
          name: components-${{ matrix.target }}
          path: target/components/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: full-${{ matrix.target }}
          path: |
            target/distrib/*.tar.xz
            target/distrib/*.zip
            target/distrib/*.sha256
            target/distrib/*-dist-manifest.json
          if-no-files-found: error

  assemble:
    needs: build
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          path: target/parts
      - name: Установка cargo-dist
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh
      - name: Проверка версии, полноты матрицы и общих файлов
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          version="$(python3 -B tools/release_bundle.py version)"
          test "$RELEASE_TAG" = dry-run || test "$RELEASE_TAG" = "v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          python3 -B tools/release_bundle.py prepare
          python3 -B tools/release_bundle.py collect --parts target/parts --output target/distrib
          dist build --artifacts=global
          dist manifest --artifacts=all --no-local-paths --output-format=json > target/complete-dist-manifest.json
          cp target/complete-dist-manifest.json target/distrib/dist-manifest.json
          python3 -B tools/release_bundle.py finalize --output target/distrib --notes target/release-notes.md
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: |
            target/distrib/*.json
            target/distrib/*.zip
            target/distrib/*.tar.xz
            target/distrib/*.sha256
            target/distrib/*.py
            target/distrib/*.sh
            target/distrib/*.ps1
            target/distrib/LICENSE
            target/distrib/sha256.sum
            target/distrib/SHA256SUMS
            target/release-notes.md
          if-no-files-found: error

  verify-installers:
    needs: assemble
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, macos-15, macos-15-intel, windows-2022]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: target/release-upload
      - name: Чистая установка, повтор и сохранность компонентов Explorer
        shell: bash
        run: |
          mkdir -p ../eska-playground
          export ESKA_TEST_ROOT="$(python -c 'from pathlib import Path; print(Path("../eska-playground").resolve())')"
          python -B tests/release_installer_smoke.py target/release-upload/distrib

  publish:
    needs: [assemble, verify-installers]
    if: inputs.tag != 'dry-run' && github.repository == 'odineska/eska' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: target/release-upload
      - name: Публикация проверенных файлов и русского описания
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ needs.assemble.outputs.version }}
        run: |
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
          test "$RELEASE_TAG" = "v$RELEASE_VERSION"
          python3 -B tools/publish_release.py target/release-upload "$RELEASE_TAG"
