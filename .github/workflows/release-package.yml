name: Release package

on:
  workflow_call:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Установка Rust из rust-toolchain.toml
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Проверка графа зависимостей и упаковка Cargo workspace
        run: |
          cargo metadata --locked --format-version 1 > /dev/null
          cargo package --workspace --locked
          python3 -B tools/release_bundle.py verify-crates
