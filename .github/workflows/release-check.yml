name: Release check

on:
  workflow_call:

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  proof:
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      reused: ${{ steps.proof.outputs.reused }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Поиск завершённой проверки этого дерева
        id: proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/release_check.py

  full:
    needs: proof
    if: ${{ !cancelled() && needs.proof.outputs.reused != 'true' }}
    uses: ./.github/workflows/ci-full.yml
